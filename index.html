<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="即売会の当日に使うレジです。商品ボタンを押して会計し、お釣り・在庫・売上・箱の中のお金を自動で出します。登録不要・無料、記録はこの端末の中だけに保存されます。">
<meta name="theme-color" content="#1f1d1b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="即売会レジ">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>即売会レジ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 執筆進捗管理表・同人誌収支ツールと同じ地と色。タブレット横向きは「商品ボタン｜かごと合計」の2列 */
:root{
  --paper:#fbfaf7; --panel:#ffffff; --ink:#1f1d1b; --sub:#6b6560; --line:#e4e0da;
  --accent:#1f62c9; --accent-ink:#1a52a8; --accent-soft:#e7effc; --accent-fg:#ffffff;
  --field-bg:#ffffff; --field-line:#8a837c; --btn-line:#77716a; --btn-shadow:0 1px 0 rgba(0,0,0,.08);
  --good:#2f8a5b; --good-soft:#e5f4e4; --bad:#c2453c; --bad-soft:#fbebeb; --zebra:#f6f4f0;
  --band:#1f1d1b; --band-fg:#ffffff;
  --q2:#1f62c9; --q3:#c2453c; --q4:#2f8a5b; --q5:#8456c9;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a1918; --panel:#232120; --ink:#efebe6; --sub:#a39d96; --line:#36332f;
  --accent:#6ea2f5; --accent-ink:#9cc0ff; --accent-soft:#1d2a3e; --accent-fg:#0f1b2d;
  --field-bg:#161514; --field-line:#77716a; --btn-line:#8a837c; --btn-shadow:0 1px 0 rgba(0,0,0,.4);
  --good:#5cc08a; --good-soft:#1c3226; --bad:#e8766d; --bad-soft:#3a1f1d; --zebra:#1f1e1c;
  --band:#000000; --band-fg:#efebe6;
  --q2:#3d7ff0; --q3:#e0544a; --q4:#3aa36d; --q5:#9b6fe0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a1918; --panel:#232120; --ink:#efebe6; --sub:#a39d96; --line:#36332f;
  --accent:#6ea2f5; --accent-ink:#9cc0ff; --accent-soft:#1d2a3e; --accent-fg:#0f1b2d;
  --field-bg:#161514; --field-line:#77716a; --btn-line:#8a837c; --btn-shadow:0 1px 0 rgba(0,0,0,.4);
  --good:#5cc08a; --good-soft:#1c3226; --bad:#e8766d; --bad-soft:#3a1f1d; --zebra:#1f1e1c;
  --band:#000000; --band-fg:#efebe6;
  --q2:#3d7ff0; --q3:#e0544a; --q4:#3aa36d; --q5:#9b6fe0; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1280px;margin:0 auto;padding-block:14px 90px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
h2{font-family:var(--f-display);font-size:18px;margin:0}
h3{font-size:14px;margin:0}
p{margin:0}
.lead{font-size:13px;color:var(--sub)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
input[type=date],input[type=text],input[type=number],select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--field-bg);border:1px solid var(--field-line);border-radius:4px;padding:5px 8px;min-width:0;max-width:100%;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);outline:none}
input[type=number],input[type=date]{font-family:var(--f-num)}
input[type=number]{text-align:right}
input.req,select.req{border:2px solid var(--accent)}
::placeholder{color:var(--sub);opacity:.7}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghost{font:inherit;font-size:13px;font-weight:500;background:var(--panel);color:var(--ink);border:1.5px solid var(--btn-line);border-radius:8px;padding:5px 11px;cursor:pointer;white-space:nowrap;box-shadow:var(--btn-shadow)}
.ghost:hover{border-color:var(--accent);background:var(--accent-soft)}
.ghost:active,.btn:active{transform:translateY(1px);box-shadow:none}
.ghost.danger{color:var(--bad);border-color:var(--bad)}
.ghost.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-fg);border:1.5px solid var(--accent);border-radius:8px;padding:7px 14px;cursor:pointer;box-shadow:var(--btn-shadow)}
.btn:disabled,.ghost:disabled{opacity:.4;cursor:not-allowed;transform:none}
.x{border:0;background:transparent;color:var(--sub);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--bad)}
@media (pointer:coarse){.ghost,.btn{min-height:38px}}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbtn{font:inherit;font-size:13px;background:transparent;border:0;color:var(--accent-ink);padding:2px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

/* 帯 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--band);color:var(--band-fg);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.band-in{max-width:1280px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap}
.band .who{display:grid;min-width:0;flex:1 1 12rem}
.band .eyebrow{font-size:11px;letter-spacing:.1em;opacity:.85}
.band h1{font-family:var(--f-display);font-weight:900;font-size:19px;margin:0;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band .now{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.band .now div{display:grid;line-height:1.2}
.band .now span{font-size:11px;opacity:.85}
.band .now b{font-family:var(--f-num);font-size:19px;font-weight:500;white-space:nowrap}
.band .helpbtn{font:inherit;font-size:13px;font-weight:700;background:transparent;color:inherit;border:1.5px solid currentColor;border-radius:999px;padding:4px 12px;cursor:pointer}
@media (max-width:560px){.band h1{font-size:16px}.band .now b{font-size:16px}.band .now{gap:12px}.band .eyebrow{display:none}}

/* タブ */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bandh,56px));z-index:5;background:var(--paper);padding:8px 0;margin:-8px 0}
html{scroll-padding-top:calc(var(--bandh,56px) + var(--tabsh,64px) + 120px)}
#secSum{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bandh,56px) + var(--tabsh,64px));z-index:4;padding:10px 14px;gap:8px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
#secSum .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
#secSum .tile{padding:6px 10px}
#secSum .tile .v{font-size:20px}
@media (max-width:700px){#secSum .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}#secSum .tile .v{font-size:15px}#secSum .tile .d{display:none}#secSum h2{font-size:15px}#secSum .tile.free{display:none}}
.tab{font:inherit;text-align:left;display:grid;gap:1px;background:var(--panel);color:var(--ink);border:1.5px solid var(--btn-line);border-radius:10px;padding:6px 12px;cursor:pointer;box-shadow:var(--btn-shadow)}
.tab b{font-family:var(--f-display);font-size:16px}
.tab span{font-size:12px;color:var(--sub)}
.tab:hover{border-color:var(--accent)}
.tab.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);box-shadow:none}
.tab:active{transform:translateY(1px)}
@media (max-width:700px){.tab{padding:6px 8px}.tab b{font-size:14px}.tab span{display:none}}
.pane{display:grid;gap:16px}
.wrap>*,.pane>*,section.card>*,.card-body>*{min-width:0}

/* まとまり */
section.card,details.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
section.card{padding:16px;display:grid;gap:12px}
.sec-h{display:grid;gap:2px}
details.card>summary{cursor:pointer;padding:12px 16px;font-family:var(--f-display);font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--sub);margin-left:6px}
details.card>summary::after{content:"開く ▾";flex:none;font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--sub)}
details.card[open]>summary::after{content:"閉じる ▴"}
.card-body{padding:0 16px 16px;display:grid;gap:16px}
.note{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;font-size:13px;display:grid;gap:6px}
.warn{color:var(--bad);font-size:13px;font-weight:700}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 16px}
.field{display:grid;gap:3px;align-content:start}
.field>label,.field>.k{font-size:12px;font-weight:700}
.field .hint{font-size:12px;color:var(--sub)}
.subopt{margin-left:9px;padding-left:16px;border-left:2px solid var(--line);display:grid;gap:8px}

/* 表：全部の列を縦にそろえる */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{font-size:12px;font-weight:700;color:var(--sub);text-align:left;padding:4px 6px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.t td{padding:5px 6px;border-bottom:1px dashed var(--line);vertical-align:middle}
table.t th.r,table.t td.r{text-align:right}
table.t th.c,table.t td.c{text-align:center}
table.t td.out{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.t td.dash{color:var(--sub);text-align:center}
table.t tfoot td{border-bottom:0;border-top:1.5px solid var(--line);font-weight:700}
table.t input[type=text]{width:100%;min-width:8rem}
table.t input[type=number]{width:6rem}
td.nw{white-space:nowrap}
.tbl-wrap table.t td{white-space:nowrap}
.tbl-wrap table.t td.wrap{white-space:normal;min-width:12rem}
tr.void td{color:var(--sub)}
tr.void td.amt{text-decoration:line-through}
.sw{display:inline-block;width:20px;height:20px;border-radius:4px;border:1px solid var(--line);vertical-align:middle}
.swatches{display:flex;gap:4px}
.swatches button{width:22px;height:22px;border-radius:5px;border:1.5px solid transparent;cursor:pointer;padding:0}
.swatches button.on{outline:2px solid var(--ink);outline-offset:1px}
.swcycle{display:none;width:30px;height:30px;border-radius:6px;border:1.5px solid var(--btn-line);cursor:pointer;padding:0;box-shadow:var(--btn-shadow)}
@media (max-width:700px){.swatches{display:none}.swcycle{display:inline-block}table.t input[type=number]{width:4.4rem}table.t input[type=text]{min-width:7rem}}
.cons-b{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
table.t.settle{max-width:420px}
table.t.settle tr.total td{font-weight:700;border-top:1.5px solid var(--line);border-bottom:0;font-size:15px}
table.t td small{font-size:11px;color:var(--sub);margin-left:2px}
ul.tight{margin:0;padding-left:1.2em;display:grid;gap:2px}
.io-out{width:100%;min-height:7rem;font-family:var(--f-num);font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:0 8px;border:1px solid var(--field-line);color:var(--sub);white-space:nowrap}
.tag.bad{border-color:var(--bad);color:var(--bad)}
.tag.cash{border-color:var(--ink);color:var(--ink)}
.tag.less{border-color:var(--accent);color:var(--accent-ink)}

/* 結果のタイル */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px;align-content:start}
.tile .k{font-size:12px;color:var(--sub)}
.tile .v{font-family:var(--f-num);font-size:24px;line-height:1.25}
.tile .d{font-size:12px;color:var(--sub)}
.tile.main{border-color:var(--accent);background:var(--accent-soft)}
.tile.bad{border-color:var(--bad);background:var(--bad-soft)}

/* ── レジ画面 ── */
.reg{display:grid;gap:16px;align-items:start}
@media (min-width:820px){.reg{grid-template-columns:minmax(0,1fr) minmax(340px,400px)}
  .reg .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bandh,56px) + var(--tabsh,64px) + 8px);max-height:var(--sidemax,640px)}}
.goods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:560px){.goods{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.gbtn{position:relative;font:inherit;text-align:left;display:grid;align-content:space-between;gap:6px;min-height:96px;padding:10px 12px 10px 16px;background:var(--panel);color:var(--ink);border:1.5px solid var(--btn-line);border-radius:12px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.gbtn::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--c,#999)}
.gbtn:active{transform:translateY(2px);box-shadow:none}
.gbtn .nm{font-weight:700;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:30px}
.gbtn .pr{font-family:var(--f-num);font-size:17px}
.gbtn .st{font-size:12px;color:var(--sub)}
.gbtn .st.low{color:var(--bad);font-weight:700}
.gbtn.out{opacity:.45;cursor:not-allowed;box-shadow:none;border-style:dashed}
.gbtn .incart{position:absolute;top:6px;right:6px}
.gbtn.flash{animation:fl .25s}
@keyframes fl{from{background:var(--accent-soft)}to{background:var(--panel)}}

/* 個数の色：1=色なし 2=青 3=赤 4=緑 5以上=紫 */
.q{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:8px;font-family:var(--f-num);font-size:18px;font-weight:500;border:2px solid var(--btn-line);background:var(--panel);color:var(--ink)}
.q.q2{background:var(--q2);border-color:var(--q2);color:#fff}
.q.q3{background:var(--q3);border-color:var(--q3);color:#fff}
.q.q4{background:var(--q4);border-color:var(--q4);color:#fff}
.q.q5{background:var(--q5);border-color:var(--q5);color:#fff}
.q.pop{animation:pop .2s}
@keyframes pop{50%{transform:scale(1.25)}}
.gbtn .incart .q{min-width:28px;height:28px;font-size:15px}

.side{display:grid;grid-template-rows:auto minmax(90px,1fr) auto;gap:0;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.side-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.side-h h2{font-size:16px}
.cart{overflow-y:auto;min-height:120px;-webkit-overflow-scrolling:touch}
.cart .empty{padding:24px 12px;color:var(--sub);font-size:13px;text-align:center}
/* かごの行：個数｜名前と単価｜小計｜−｜＋｜×（全部の行で同じ列） */
.crow{display:grid;grid-template-columns:40px minmax(0,1fr) 5.6rem 38px 38px 30px;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px dashed var(--line)}
.crow .nm{font-weight:700;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.crow .nm small{display:block;font-weight:400;font-size:12px;color:var(--sub);font-family:var(--f-num)}
.crow .nm small i{font-style:normal;display:none}
@media (max-width:560px){.crow{grid-template-columns:36px minmax(0,1fr) 36px 36px 26px;padding:7px 8px}.crow .sub{display:none}.crow .nm small i{display:inline}.crow .pm{height:36px}}
.crow .sub{font-family:var(--f-num);text-align:right;white-space:nowrap}
.crow .pm{font:inherit;font-size:20px;line-height:1;height:38px;border-radius:8px;border:1.5px solid var(--btn-line);background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:var(--btn-shadow);touch-action:manipulation}
.crow .pm:active{transform:translateY(1px);box-shadow:none}
.crow .pm:disabled{opacity:.35}
.crow.disc .nm{color:var(--bad)}
.crow.disc .sub{color:var(--bad)}
.pay{border-top:1.5px solid var(--line);padding:10px 12px 12px;display:grid;gap:10px;background:var(--panel)}
@media (min-width:820px){.pay{max-height:calc(var(--sidemax,640px) - 150px);overflow-y:auto}}
.totalrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.totalrow .k{font-weight:700}
.totalrow .v{font-family:var(--f-num);font-size:36px;line-height:1.1}
.totalrow .cnt{font-size:12px;color:var(--sub)}
.discrow{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
.discrow input{width:6rem;text-align:right;font-family:var(--f-num)}
.change{border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;gap:2px}
.change .h{font-size:12px;color:var(--sub)}
/* お釣りの早見：もらった額｜→｜お釣り */
.chg{display:grid;grid-template-columns:7rem 1.5rem 1fr;align-items:baseline;font-family:var(--f-num)}
.chg .a{text-align:right}
.chg .ar{text-align:center;color:var(--sub);font-family:var(--f-body)}
.chg .b{text-align:right;font-size:19px}
.chg .b small{font-family:var(--f-body);font-size:12px;color:var(--sub);margin-right:6px}
.paybtns{display:grid;grid-template-columns:3fr 2fr;gap:8px}
.paybtns.one{grid-template-columns:1fr}
.paybtns .btn,.paybtns .ghost{min-height:54px;font-size:16px;font-weight:700;white-space:normal;line-height:1.25}
.subbtns{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.warnbox{border:1.5px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
/* スマホ：下に合計とかごへのボタン */
.minibar{display:none}
@media (max-width:819px){
  .minibar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:7;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border-top:1.5px solid var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.1);
    padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .minibar b{font-family:var(--f-num);font-size:22px}
  .cart{max-height:none}
}

/* 2つ以上入れた商品はボタンごと色を変える（打ち間違いを目立たせる） */
.gbtn.in{border-width:3px;border-color:var(--ink)}
.gbtn.g2,.gbtn.g3,.gbtn.g4,.gbtn.g5{color:#fff}
.gbtn.g2{background:var(--q2);border-color:var(--q2)}
.gbtn.g3{background:var(--q3);border-color:var(--q3)}
.gbtn.g4{background:var(--q4);border-color:var(--q4)}
.gbtn.g5{background:var(--q5);border-color:var(--q5)}

<script>
"use strict";
const KEY = "doujin-regi-v1";
const TOOL = "即売会レジ";
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n = v => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
const has = v => v !== "" && v != null && Number.isFinite(Number(v));
const yen = v => Math.round(v).toLocaleString("ja-JP") + "円";
const numish = v => (v === "" ? "" : Number(v));
const $ = id => document.getElementById(id);
const pad = x => String(x).padStart(2, "0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const mdhm = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${hm(t)}`; };
const COLORS = ["#e8892b", "#c8306a", "#2f6fd0", "#2f8a5b", "#8456c9", "#9a6000", "#6b6560"];
const qc = q => (q >= 5 ? "q5" : q === 4 ? "q4" : q === 3 ? "q3" : q === 2 ? "q2" : "");
const PAY = { cash: "現金", less: "キャッシュレス", free: "無料" };

/* ── データ ──
   items：商品（全イベント共通）。set=true はセットで、parts の中身から在庫を引く
   events：イベントごとに 在庫・最初に金庫に入れた額・会計・金庫の出し入れ を持つ */
const newItem = (name = "新しい商品", price = "", color = COLORS[0]) => ({ id: uid(), name, price, color, set: false, parts: [], low: "" });
const newEvent = (name = "新しいイベント") => ({ id: uid(), name, date: today(), open: "", close: "", startDen: {}, start: "", counted: "", stock: {}, sales: [], moves: [] });

function sample() {
  const a = newItem("新刊（サンプル）", 800, COLORS[0]); a.low = 5;
  const b = newItem("既刊（サンプル）", 500, COLORS[2]); b.low = 3;
  const c = newItem("アクスタ（サンプル）", 1500, COLORS[1]);
  const d = newItem("ステッカー（サンプル）", 200, COLORS[3]);
  const s = newItem("新刊＋既刊セット（サンプル）", 1200, COLORS[4]); s.set = true; s.parts = [{ id: a.id, q: 1 }, { id: b.id, q: 1 }];
  const ev = newEvent("イベントA（サンプル）"); ev.start = 20000; ev.open = "10:30"; ev.close = "15:30";
  ev.stock = { [a.id]: 100, [b.id]: 6, [c.id]: 20, [d.id]: 50 };
  return { items: [a, b, c, d, s], cons: [], events: [ev], current: ev.id, tab: "reg", cart: [], disc: "", recv: [], cashMode: false, sample: true };
}

let S;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && Array.isArray(o.items) && o.events?.length) { S = o; fix(); return; } } } catch (_) {}
  S = sample();
}
function fix() {
  S.cart = Array.isArray(S.cart) ? S.cart : []; S.recv = Array.isArray(S.recv) ? S.recv : []; S.events.forEach(e => { e.startDen = e.startDen || {}; }); S.disc = S.disc ?? "";
  S.items.forEach(x => { x.parts = x.parts || []; x.from = x.from || ""; }); S.cons = Array.isArray(S.cons) ? S.cons : [];
  if (!S.events.some(e => e.id === S.current)) S.current = S.events[0].id;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} }
const EV = () => S.events.find(e => e.id === S.current) || S.events[0];
const IT = id => S.items.find(x => x.id === id);
const singles = () => S.items.filter(x => !x.set);
const sets = () => S.items.filter(x => x.set);
const CO = id => (S.cons || []).find(c => c.id === id);
const newCons = () => ({ id: uid(), name: "", fee: "", feeKind: "pct", disc: "self", less: "" });

/* ── 計算 ── */
// ある商品を1個売ると、どの単品が何個減るか
const baseOf = (x, parts) => (x.set ? (parts || x.parts).filter(p => IT(p.id)).map(p => ({ id: p.id, q: n(p.q) })) : [{ id: x.id, q: 1 }]);
function soldMap(ev) {
  const m = {};
  ev.sales.forEach(s => { if (s.void) return; s.lines.forEach(l => {
    const parts = l.parts || [{ id: l.id, q: 1 }];
    parts.forEach(p => { m[p.id] = (m[p.id] || 0) + n(p.q) * n(l.qty); });
  }); });
  return m;
}
const stockOf = (ev, id) => (has(ev.stock[id]) ? n(ev.stock[id]) : null);
// 残り（在庫を入れていなければ null）
function remain(ev, id, sold) { const st = stockOf(ev, id); return st == null ? null : st - (sold[id] || 0); }
function cartNeed() { const m = {}; S.cart.forEach(c => { const x = IT(c.id); if (!x) return; baseOf(x).forEach(p => { m[p.id] = (m[p.id] || 0) + p.q * c.qty; }); }); return m; }
// その商品をあと何個かごに入れられるか（在庫なしの単品は Infinity）
function canMore(ev, x, sold, need) {
  const parts = baseOf(x); if (!parts.length) return 0;
  let k = Infinity;
  parts.forEach(p => { const r = remain(ev, p.id, sold); if (r == null || !p.q) return; k = Math.min(k, Math.floor((r - (need[p.id] || 0)) / p.q)); });
  return k;
}
function itemRemain(ev, x, sold) {
  if (!x.set) return remain(ev, x.id, sold);
  let k = null; baseOf(x).forEach(p => { const r = remain(ev, p.id, sold); if (r == null || !p.q) return; const v = Math.floor(r / p.q); k = k == null ? v : Math.min(k, v); });
  return k;
}
const isLow = (x, r) => r != null && r > 0 && has(x.low) && r <= n(x.low);
function cartSum() { return S.cart.reduce((a, c) => a + n(c.price) * c.qty, 0); }
function cartTotal() { return Math.max(0, cartSum() - n(S.disc)); }
function totals(ev) {
  const t = { cash: 0, less: 0, free: 0, count: 0, items: 0, disc: 0 };
  ev.sales.forEach(s => { if (s.void) return; t.count++; t[s.pay] += s.pay === "free" ? s.sub : s.total; if (s.pay !== "free") t.disc += n(s.disc);
    t.items += s.lines.reduce((a, l) => a + n(l.qty), 0); });
  t.sales = t.cash + t.less;
  t.moves = ev.moves.reduce((a, m) => a + n(m.amount), 0);
  t.box = n(ev.start) + t.cash + t.moves;
  return t;
}
/* 委託：会計ごとの売上を、自分と委託元ごとに分ける */
// 1行の売上を持ち主ごとに分ける。セットは中身の定価の割合で分ける
function lineShares(l) {
  if (l.parts && l.parts.length) {
    const ps = l.parts.map(p => { const x = IT(p.id); return { id: p.id, q: n(p.q), from: p.from ?? (x ? x.from || "" : ""), unit: has(p.unit) ? n(p.unit) : n(x && x.price) }; });
    const w = ps.reduce((a, p) => a + p.unit * p.q, 0), qs = ps.reduce((a, p) => a + p.q, 0);
    return ps.map(p => ({ id: p.id, from: p.from, units: p.q * n(l.qty), val: n(l.price) * n(l.qty) * (w ? (p.unit * p.q) / w : qs ? p.q / qs : 0), viaSet: true }));
  }
  const x = IT(l.id);
  return [{ id: l.id, from: l.from ?? (x ? x.from || "" : ""), units: n(l.qty), val: n(l.price) * n(l.qty), viaSet: false }];
}
function consignOf(ev) {
  const out = {};
  (S.cons || []).forEach(c => { out[c.id] = { c, items: {}, gross: 0, disc: 0, cash: 0, less: 0, lessFee: 0, units: 0, free: 0 }; });
  ev.sales.forEach(s => { if (s.void) return;
    const sh = s.lines.flatMap(lineShares), sub = sh.reduce((a, x) => a + x.val, 0);
    sh.forEach(x => { const o = out[x.from]; if (!o) return;
      const it = o.items[x.id] || (o.items[x.id] = { id: x.id, n: 0, set: 0, f: 0, amt: 0 });
      if (s.pay === "free") { it.f += x.units; o.free += x.units; return; }
      it.n += x.units; if (x.viaSet) it.set += x.units; it.amt += x.val; o.units += x.units; o.gross += x.val;
      const dsh = sub ? (n(s.disc) * x.val) / sub : 0, d = o.c.disc === "share" ? dsh : 0, net = x.val - d;
      o.disc += d; if (s.pay === "cash") o.cash += net; else { o.less += net; if (has(o.c.less)) o.lessFee += (net * n(o.c.less)) / 100; } });
  });
  Object.values(out).forEach(o => {
    singles().filter(x => x.from === o.c.id).forEach(x => { if (!o.items[x.id]) o.items[x.id] = { id: x.id, n: 0, set: 0, f: 0, amt: 0 }; });
    o.sales = o.gross - o.disc;
    o.fee = !has(o.c.fee) ? 0 : o.c.feeKind === "yen" ? n(o.c.fee) * o.units : (o.sales * n(o.c.fee)) / 100;
    o.lessFee = Math.round(o.lessFee); o.fee = Math.round(o.fee); o.sales = Math.round(o.sales); o.disc = Math.round(o.disc); o.cash = Math.round(o.cash); o.less = Math.round(o.less);
    o.pay = o.sales - o.lessFee - o.fee;
  });
  return out;
}
const feeText = c => (!has(c.fee) || !n(c.fee) ? "なし" : c.feeKind === "yen" ? `1つにつき${yen(n(c.fee))}` : `売上の${n(c.fee)}%`);
function consMemo(ev, o) {
  const L = [`【委託の精算】${o.c.name || "（名前なし）"} さん`, `${ev.name}（${ev.date || ""}）`, ""];
  Object.values(o.items).forEach(it => { const x = IT(it.id); const st = stockOf(ev, it.id); const back = st == null ? null : st - it.n - it.f;
    L.push(`・${x ? x.name : "（消した商品）"}：${it.n}点${it.set ? `（うちセット${it.set}点）` : ""}${it.f ? `・無料で渡した ${it.f}点` : ""}・${yen(it.amt)}${st != null ? `／持ち込み ${st}・お返し ${back}` : ""}`); });
  L.push("", `売上 ${yen(o.gross)}`);
  if (o.disc) L.push(`値引きの負担 −${yen(o.disc)}`);
  if (o.lessFee) L.push(`キャッシュレスの手数料（${n(o.c.less)}%） −${yen(o.lessFee)}`);
  if (o.fee) L.push(`委託手数料（${feeText(o.c)}） −${yen(o.fee)}`);
  L.push(`お渡しする額 ${yen(o.pay)}`);
  return L.join("\n");
}
// お釣りの早見に出す「もらう額」。小銭を足してお釣りをきりのよい額にする出し方も入れる
function tenders(T) {
  if (T <= 0) return [];
  const c = new Set();
  if (T < 1000) { const h = Math.ceil(T / 500) * 500; if (h > T) c.add(h); }
  const k = Math.ceil(T / 1000) * 1000; if (k > T) c.add(k);
  if (T < 5000) c.add(5000);
  if (T < 10000) c.add(10000);
  if (T >= 10000) { const m = Math.ceil(T / 5000) * 5000; if (m > T) c.add(m); c.add(Math.ceil((T + 1) / 10000) * 10000); }
  const base = [...c].sort((a, b) => a - b).slice(0, 4);
  const rows = base.map(a => ({ give: a, extra: 0 }));
  // 小銭を足す：お釣りが500円単位（と、端数があれば100円単位）になる額を、お札の額に足す
  base.filter(a => a % 1000 === 0).forEach(a => {
    [500, 100].forEach(u => { const e = (((T - a) % u) + u) % u; if (e > 0 && e < 1000 && a + e > T && !rows.some(r => r.give === a + e)) rows.push({ give: a + e, extra: e, bill: a }); });
  });
  return rows.sort((x, y) => x.give - y.give).slice(0, 9);
}
/* 金種 */
const DENOMS = [10000, 5000, 2000, 1000, 500, 100, 50, 10, 5, 1];
const BILLS = [1000, 2000, 5000, 10000], COINS = [1, 5, 10, 50, 100, 500];
const dname = d => d.toLocaleString("ja-JP") + (d >= 1000 ? "円札" : "円玉");
const denSum = m => Object.entries(m || {}).reduce((a, [d, k]) => a + Number(d) * n(k), 0);
const hasDen = m => Object.values(m || {}).some(k => n(k) > 0);
const recvMap = () => { const m = {}; (S.recv || []).forEach(d => { m[d] = (m[d] || 0) + 1; }); return m; };
const denText = m => DENOMS.filter(d => n(m[d]) > 0).map(d => `${dname(d)}×${n(m[d])}`).join("、");
// 金庫の中の金種：最初の内訳＋もらった−お釣りで出した。内訳がわからない現金（金種を入れずに決済・出し入れ）は「わからない額」
function boxDen(ev) {
  // C=お釣り用の金庫 S=売上用の金庫（分けていないときは合わせて使う）
  const cntC = {}, cntS = {}; DENOMS.forEach(d => { cntC[d] = n((ev.startDen || {})[d]); cntS[d] = 0; });
  const known = hasDen(ev.startDen);
  let recvIn = 0, chgOut = 0, noRecv = 0, movC = 0, movS = 0;
  ev.sales.forEach(s => { if (s.void || s.pay !== "cash") return;
    if (s.recv) { DENOMS.forEach(d => { cntS[d] += n(s.recv[d]); cntC[d] -= n((s.chg || {})[d]); }); recvIn += denSum(s.recv); chgOut += denSum(s.chg); }
    else noRecv += s.total; });
  ev.moves.forEach(m => { const sg = n(m.amount) < 0 ? -1 : 1, toS = m.box === "sale";
    if (toS) movS += n(m.amount); else movC += n(m.amount);
    if (m.den) DENOMS.forEach(d => { (toS ? cntS : cntC)[d] += sg * n(m.den[d]); }); });
  const cnt = {}; DENOMS.forEach(d => { cnt[d] = cntC[d] + cntS[d]; });
  const t = totals(ev);
  return { cnt, cntC, cntS, known, unknown: t.box - denSum(cnt), chgBox: n(ev.start) - chgOut + movC, saleBox: recvIn + movS, noRecv };
}
// お釣りの内訳：手で直した内訳があれば（同じ受け取り・合計のときだけ）それを使う
function changeOf(ev, rm, amount) {
  const key = JSON.stringify(rm) + "|" + amount;
  if (S.chgOv && S.chgOv.key === key) { const out = { ...S.chgOv.out }; Object.keys(out).forEach(d => { if (!out[d]) delete out[d]; }); return { out, short: 0, manual: true, diff: denSum(out) !== amount }; }
  const c = makeChange(amount, availFor(ev, rm)); return { ...c, manual: false, diff: false };
}
// 決済のときにお釣りを出せる金種（分けているときはお釣り用の金庫だけ。もらったお金も使える）
function availFor(ev, rm) {
  const bd = boxDen(ev); if (!bd.known) return null;
  const av = { ...(S.split ? bd.cntC : bd.cnt) }; DENOMS.forEach(d => { av[d] = (av[d] || 0) + n(rm[d]); }); return av;
}
// お釣りの内訳。金庫の中身がわかるときは、ない金種を使わない
function makeChange(amount, avail) {
  const out = {}; let rem = amount;
  DENOMS.forEach(d => { if (d === 2000 && !(avail && avail[d] > 0)) return; let k = Math.floor(rem / d); if (avail) k = Math.min(k, Math.max(0, avail[d] || 0)); if (k > 0) { out[d] = k; rem -= k * d; } });
  return { out, short: rem };
}

  <div><h3>レジの使い方</h3><ul>

    <li>個数は色でも見分けられます：<span class="legend"><span><span class="q">1</span>色なし</span><span><span class="q q2">2</span>青</span><span><span class="q q3">3</span>赤</span><span><span class="q q4">4</span>緑</span><span><span class="q q5">5</span>5つ以上は紫</span></span> 押し間違いにすぐ気づけるようにするためです。商品ボタンも、1つ入れると枠が太くなり、2つ以上でボタン全体がその色に変わります。右上には個数が出ます。</li>
    <li>かごの「−」で1つ減らし、「＋」で1つ増やし、「×」でその商品をかごから出します。「かごを空にする」は全部出します。</li>
    <li>値引きは、かご全体から引く額を円で入れます（数字以外は入りません）。決済するとその会計の値引きとして残り、次の会計では空に戻ります。</li>
    <li>合計の下に「もらった額 → お釣り」が出ます。合計に合わせて、500円・1,000円単位・5,000円・10,000円などのよくある出し方を自動で選びます。点線の下の段は、小銭を足してお釣りをきりのよい額にする出し方です（例：800円に1,000円＋300円＝1,300円を出して、お釣り500円）。</li></ul></div>
  <div><h3>決済のボタン</h3><ul>
    <li>現金だけ・キャッシュレスだけで頒布するときは、「商品と準備」の「レジの設定」で、使わないほうの決済ボタンを隠せます（どちらか1つは表示されます）。</li>
    <li><b>現金で決済</b>：売上に入り、金庫にあるはずの額にも入ります。</li>
    <li><b>キャッシュレスで決済</b>：PayPayなどで受け取ったときに押します。売上には入りますが、金庫の中の額には入りません。</li>
    <li><b>無料で渡した</b>：献本・交換など、お金をもらわずに渡したときに押します。在庫は減り、売上には入りません。</li>
    <li>決済すると下にお知らせが出て、そこの「取り消す」で直前の会計を取り消せます。お知らせが消えたあとは、かごの下の「直前の会計を取り消す」か、履歴の「取り消す」を使います。</li></ul></div>
  <div><h3>現金ボタン（もらったお金を数える）</h3><p>「商品と準備」タブの「レジの設定」で「現金ボタンを表示する」にチェックを入れると、レジの商品ボタンの下に、お札と硬貨のボタンが出ます。上の段がお札、下の段が硬貨で、それぞれ大きい額から並びます。どの金種を出すかは、チェックのすぐ下の「表示する金種」で選べます（はじめは10,000・5,000・1,000円札と500・100・50・10円玉）。受け取ったお金を1枚ずつ押すと、かごの下に「もらった」額・お釣り・お釣りの内訳が出ます。押し間違えたら「1枚戻す」、最初からなら「数え直す」です。足りないときは「あと○円足りません」と出て、現金で決済できません。お釣りの内訳は大きい金種から使います（5,000円のお釣りなら5,000円札1枚）。釣り銭を枚数で入れてあれば、金庫にない金種は使いません。</p><p>実際に違う金種で渡すときは、内訳の横の「内訳を直す」で、金種ごとに−・＋で枚数を直します。合計がお釣りと合わないうちは現金で決済できません。「自動の内訳に戻す」で元に戻せます。受け取ったお金や合計が変わると、自動の内訳に戻ります。</p><p>ボタンを押さずに「現金で決済」しても使えます。その会計の金種は「内訳がわからない額」として数えるだけで、売上や金庫の中の合計額は変わりません。途中で表示を切り替えても大丈夫です。</p></div>
  <div><h3>釣り銭の内訳</h3><p>「商品と準備」タブの「釣り銭」で、お札・硬貨の枚数を入れると、その合計が「最初に金庫に入れたお金」に自動で入ります（このときは合計の欄は直せません）。「枚数を全部消す」（2回押して確定）で枚数を空にすると、合計を手で入れられます。</p><p>お釣り用と売上用で金庫を分けているときは、「お釣り用と売上用で金庫を分けている」にチェックを入れます。「履歴と集計」の金庫のお金に、お釣り用の金庫（最初の釣り銭−お釣りで出した額±出し入れ）と売上用の金庫（もらったお金±出し入れ）の額と金種が分かれて出ます。お釣りの内訳は、お釣り用の金庫にある金種（と、もらったお金）から決めます。現金ボタンを使わない会計は、もらった額とお釣りがわからないので、どちらの金庫にも入れず、別に表示します。枚数を入れておくと、「履歴と集計」の「あるはずの金種」で、金庫の中に何円札・何円玉が何枚あるはずかが出ます。</p></div>
  <div><h3>在庫と品切れ</h3><p>「商品と準備」タブの「在庫」は、そのイベントに持っていく数です。入れた商品だけ、商品ボタンに「残り○」が出ます。「残り少ない」に数を入れておくと、残りがその数以下になったときにボタンの文字が赤くなり、決済のお知らせでも知らせます。残りが0になると「品切れ」になってボタンが薄くなり、押せなくなります。かごに入っている分も数えるので、残りより多くはかごに入りません。在庫が空欄の商品は数えないので、いくつでも入ります。商品の表の下の「在庫を全部消す」「残り少ないを全部消す」で、まとめて空にできます（2回押して確定）。</p></div>
  <div><h3>セット</h3><p>「新刊＋既刊セット」のように、まとめて売る商品を作れます。「中身を変える」で、セット1つに入る商品と数を決めます。セットが売れると中身の商品の残りが減ります。セット自体に在庫は入れず、中身の残りから作れる数が「残り」に出ます。</p></div>
  <div><h3>委託（ほかの人の本を置くとき）</h3><p>「商品と準備」タブの「委託」で「＋ 委託元を足す」を押し、委託元の名前を入れます。すると「商品」の表に「委託元」の列が出るので、あずかった商品ごとに委託元を選びます（はじめは「自分」）。レジでは自分の商品と同じように並び、同じように会計できます。</p><ul>
    <li><b>委託手数料</b>：もらう場合だけ、「売上の○%」か「1つにつき○円」で入れます。空欄か0なら取りません。</li>
    <li><b>値引きの持ち方</b>：委託品が入った会計で値引きしたときの分け方です。「自分が持つ」（はじめの設定）なら委託分は定価のまま、「金額の割合で分ける」なら委託分もその割合で値引きします。</li>
    <li><b>キャッシュレスの手数料</b>：決済サービスの手数料を委託分にも負担してもらうときに、その率（%）を入れます。空欄なら負担なしです。</li>
    <li><b>セット</b>：自分の本と委託品を組んだセットが売れたときは、セットの売上を中身の定価の割合で分けます。</li>
    <li><b>無料で渡した</b>：委託品を献本・交換に使ったときは、売上には入らず「無料」の数に出ます。委託品を無料で渡してよいかは、先に委託元と相談しておきましょう。</li></ul>
  <p>「履歴と集計」タブの「委託の精算」に、委託元ごとの売れた数・金額・持ち込み・お返しの数と、売上から値引きの負担・手数料を引いた「お渡しする額」が出ます。お返しは「持ち込み−売れた数−無料で渡した数」で、在庫を入れた商品だけ出ます。「精算メモをコピー」で、同じ内容を文字でコピーできるので、そのまま委託元に送れます。会計の取り消しや設定の変更は、すぐ反映されます。</p>
  <p>コミックマーケットなどでは、委託品も自分のサークルの頒布物と同じ扱いで、内容の責任はサークル側にあります。見本誌の提出などは、各イベントのルールを確認してください。</p></div>
  <div><h3>金庫のお金</h3><p>金庫にあるはずの額は「最初に金庫に入れたお金＋現金の売上＋足した額−抜いた額」です。両替や買い出しで出し入れしたときは「履歴と集計」タブの「金庫のお金」で記録してください。メモは「両替」「お昼代」「買い出し」のボタンを押すと入り、前に入れたメモも候補に出ます。「金種で入れる」を開いて枚数を入れると、金額は枚数から計算し、あるはずの金種にも反映します（入れなければ金額だけの記録になります）。金庫を分けているときは、どちらの金庫かも選びます。閉場後などに金庫の中を数えたら「数えた額」に入れると、あるはずの額との差が出ます。</p><p>釣り銭を枚数で入れたか、現金ボタンを使った会計があると、「あるはずの金種」の表が出ます。最初の枚数＋もらった枚数−お釣りで出した枚数±出し入れの枚数です。金種のわからない現金（ボタンを使わない会計・金種を入れていない出し入れ・枚数を入れていない釣り銭）は、下の「内訳がわからない額」にまとめます。お釣りを内訳どおりに渡さなかったときは、実際の枚数とずれます。</p></div>
  <div><h3>ランキングと時間帯</h3><ul>
    <li><b>商品ごとのランキング</b>：「並べ順」で、売れた数・金額・在庫に対して売れた割合・売れるペースを選べます。売上に占める割合は金額と必ず同じ順になるので、表に数字だけ出しています。ペースは「何分に1つ売れたか」で、開始の時刻から最後の会計（品切れした商品は品切れの時刻）までの時間を売れた数で割っています。品切れした商品は、品切れになった会計の時刻も出ます。同じ順位は同じ番号になります。</li>
    <li><b>一緒に買われた組み合わせ</b>：同じ会計で買われた商品の組み合わせを、多い順に5つまで出します。</li>
    <li><b>時間帯ごとの売上</b>：開始の時刻から、選んだ分（10〜120分）ごとに会計・点数・金額をまとめます。いちばん売れた時間帯は色が付きます。「並べ順」で金額の多い順にもできます。</li>
    <li><b>商品ごとの時間帯別の数</b>：同じ区切りで、商品ごとに何個売れたかを表にします。その商品がいちばん売れた時間帯は青の太字になります。</li></ul></div>
  <div><h3>会計の履歴の並べ替えと絞り込み</h3><p>「並べ替え」で日時・金額の昇順・降順を選べます。「時間帯」は、履歴にある時間（○時台）から選ぶか、「時刻を指定する」で何時から何時までを入れます。「商品で絞る」で商品を2つ以上選ぶと、「どれかを含む（or）」か「全部を含む（and）」かを選べます。ほかに支払いの種類と、取り消した会計を隠すこともできます。表の下に、絞った会計の合計が出ます。</p></div>
  <div><h3>打ち間違えたとき</h3><p>決済したあとで間違いに気づいたら、会計を取り消して、もう一度打ち直します。取り消した会計は売上・在庫・金庫の中の額から外れ、履歴には線を引いて残ります。取り消しを間違えたときは「戻す」で元に戻せます。</p></div>
  <div><h3>イベントごとの記録</h3><p>記録はイベントごとに分かれます。次のイベントでは「商品と準備」タブの「新しいイベントを作る」を押すと、商品はそのまま、在庫の数・時刻・釣り銭を引き継いだ新しいイベントになります（在庫は持っていく数に直してください）。前のイベントの記録は「表示しているイベント」で選ぶと見られます。</p></div>
  <div><h3>同人誌収支ツールから取り込む</h3><p>収支ツールの「保存と読み込み」で保存したファイルを、「商品と準備」タブのいちばん下で選ぶか、「文字をコピー」した文字を貼り付けて、「貼り付けた内容を読む」を押します。どの頒布先の価格を使うかを選び、取り込む頒布物にチェックを入れて「選んだ商品を取り込む」を押してください。同じ名前の商品があれば、価格だけ書き換えます。在庫は取り込みません。</p></div>
  <div><h3>表計算用にコピー</h3><p>「履歴と集計」タブの「表計算用にコピー（CSV）」で、会計の一覧（日時・内容・委託元・支払い・金額）をコピーできます。Excelやスプレッドシートに貼り付けると、1行に1つの商品で並びます。</p></div>
  <div><h3>画面の見方</h3><ul>
    <li>青く塗ったボタンは大事な操作（現金で決済など）、枠のボタンは普通の操作です。赤い枠のボタンは消す・取り消す操作です。</li>
    <li>青い枠のマスは、使うのに必要な欄です（イベント名・商品名・価格）。</li>
    <li>商品の色は、レジのボタンの左端の色です。スマホなど幅の狭い画面では、色の四角を押すたびに次の色に変わります。</li>
    <li>赤い文字は、品切れ・残り少ない・合わないなどの注意です。</li></ul></div>
  <div><h3>保存について</h3><p>記録はこのブラウザに自動で保存されます。電波のない会場でも、そのまま使えます。ブラウザのデータを消すと記録も消えるので、イベントが終わったら「保存と読み込み」の「ファイルに保存」で控えを取ってください。「文字をコピー」で文字として持ち出すこともできます。</p><p>読み込むときは、書き出したファイルを選ぶか、書き出した文字を貼り付けて「読み込む」を押します。今の記録は読み込んだ内容に置き換わるので、サンプル以外のときは2回押して確定します。結果は、押したボタンのすぐ横に出ます。</p></div>`;
}

function renderAll(pop) {
  renderTabs(); renderBand(); renderReg(pop); renderSettings(); renderEvent(); renderItems(); renderSets(); renderCons(); renderImport(); renderImpOut(); renderLog(); renderMgmt(); renderHelp();
}
function softRender(pop) { renderBand(); renderReg(pop); }

/* お知らせ */
let toastT = null;
function toast(html, opts = {}) {
  clearTimeout(toastT);
  $("toastBox").innerHTML = `<div class="toast ${opts.bad ? "bad" : ""}" role="status"><span>${html}</span>${opts.undo ? `<button data-act="undoLast">取り消す</button>` : ""}</div>`;
  toastT = setTimeout(() => { $("toastBox").innerHTML = ""; }, opts.ms || 5000);
}

/* ── 操作 ── */
function addToCart(id) {
  const x = IT(id); if (!x) return;
  const ev = EV(), sold = soldMap(ev), need = cartNeed();
  if (x.set && !x.parts.length) { toast("このセットは中身が決まっていません", { bad: true }); return; }
  if (canMore(ev, x, sold, need) <= 0) { toast(`${esc(x.name)}は残りがありません`, { bad: true }); return; }
  const c = S.cart.find(c => c.id === id);
  if (c) c.qty++; else S.cart.push({ id, name: x.name, price: x.price, qty: 1 });
  save(); softRender(id);
  const b = document.querySelector(`.gbtn[data-id="${id}"]`); if (b) b.classList.add("flash");
}
function checkout(pay) {
  if (!S.cart.length) return;
  const ev = EV();
  const lines = S.cart.map(c => { const x = IT(c.id); return { id: c.id, name: c.name, price: n(c.price), qty: c.qty, ...(x && x.set ? { parts: x.parts.map(p => { const y = IT(p.id); return { ...p, from: y ? y.from || "" : "", unit: n(y && y.price) }; }) } : { from: x ? x.from || "" : "" }) }; });
  const sub = lines.reduce((a, l) => a + l.price * l.qty, 0);
  const disc = pay === "free" ? 0 : Math.min(sub, n(S.disc));
  const total = pay === "free" ? 0 : sub - disc;
  const sale = { id: uid(), t: Date.now(), lines, sub, disc, total, pay };
  const rm = recvMap(), rs = denSum(rm);
  if (pay === "cash" && S.cashMode && rs > 0) {
    if (rs < total) { toast(`もらったお金が ${yen(total - rs)} 足りません`, { bad: true }); return; }
    const c2 = changeOf(ev, rm, rs - total);
    if (c2.diff) { toast("お釣りの内訳の合計が合っていません。内訳を直してください", { bad: true }); return; }
    sale.recv = rm; sale.chg = c2.out;
  }
  ev.sales.push(sale);
  // 残り少ない・品切れになった商品を知らせる
  const sold = soldMap(ev); const alerts = [];
  const touched = new Set(); lines.forEach(l => (l.parts || [{ id: l.id }]).forEach(p => touched.add(p.id)));
  touched.forEach(id => { const x = IT(id); if (!x) return; const r = remain(ev, id, sold); if (r == null) return;
    if (r <= 0) alerts.push(`${esc(x.name)}が品切れです`); else if (isLow(x, r)) alerts.push(`${esc(x.name)}は残り${r}`); });
  S.cart = []; S.disc = ""; S.recv = []; S.chgOv = null; S.chgEdit = false;
  save(); renderAll();
  toast(`${PAY[pay]}で決済しました（${yen(total)}${sale.recv && rs - total ? `・お釣り ${yen(rs - total)}` : ""}）${alerts.length ? `<br><b>${alerts.join("／")}</b>` : ""}`, { undo: true, ms: alerts.length ? 9000 : 6000, bad: alerts.length > 0 });
}
function undoLast() {
  const ev = EV(); const s = ev.sales.slice().reverse().find(s => !s.void); if (!s) return;
  s.void = true; save(); renderAll();
  toast(`${hm(s.t)}の会計（${yen(s.total)}）を取り消しました。履歴の「戻す」で元に戻せます`);
}
function move(i, d) { const x = S.items[i], same = S.items.map((y, k) => [y, k]).filter(([y]) => y.set === x.set).map(([, k]) => k); const at = same.indexOf(i), j = same[at + d]; if (j == null) return; [S.items[i], S.items[j]] = [S.items[j], S.items[i]]; }

// ボタンの文字を一時的に変えて、少したったら元に戻す
function flash(b, text, ms = 2500) { if (!b.dataset.label) b.dataset.label = b.textContent; b.textContent = text; clearTimeout(b._ft); b._ft = setTimeout(() => { b.textContent = b.dataset.label; delete b.dataset.label; }, ms); }
let armed = null;
function arm(btn, label, fn) {
  if (armed === btn.id) { armed = null; fn(); return; }
  armed = btn.id; btn.classList.add("armed"); btn.textContent = label;
  setTimeout(() => { if (armed === btn.id) { armed = null; renderAll(); } }, 3000);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id, ev = EV();
  if (act === "add") { addToCart(id); return; }
  if (act === "inc") { addToCart(id); return; }
  if (act === "dec") { const c = S.cart.find(c => c.id === id); if (!c) return; c.qty--; if (c.qty <= 0) S.cart = S.cart.filter(x => x !== c); save(); softRender(id); return; }
  if (act === "rm") { S.cart = S.cart.filter(c => c.id !== id); save(); softRender(); return; }
  if (act === "clear") { S.cart = []; S.disc = ""; S.recv = []; save(); softRender(); return; }
  if (act === "nodisc") { S.disc = ""; save(); softRender(); return; }
  if (act === "recv") { S.recv.push(Number(b.dataset.v)); save(); softRender(); return; }
  if (act === "chgEdit") { S.chgEdit = !S.chgEdit; save(); softRender(); return; }
  if (act === "chgAuto") { S.chgOv = null; save(); softRender(); return; }
  if (act === "chgInc" || act === "chgDec") { const rm = recvMap(), amt = denSum(rm) - cartTotal(); const c2 = changeOf(EV(), rm, amt); const out = { ...c2.out }; const d = b.dataset.v; out[d] = Math.max(0, n(out[d]) + (act === "chgInc" ? 1 : -1)); S.chgOv = { key: JSON.stringify(rm) + "|" + amt, out }; save(); softRender(); return; }
  if (act === "memo") { $("mvMemo").value = b.dataset.v; return; }
  if (act === "recvBack") { S.recv.pop(); save(); softRender(); return; }
  if (act === "recvClear") { S.recv = []; save(); softRender(); return; }
  if (act === "lgReset") { S.logF = null; save(); renderSales(ev); return; }
  if (act === "pay") { checkout(b.dataset.v); return; }
  if (act === "undoLast") { $("toastBox").innerHTML = ""; undoLast(); return; }
  if (act === "toCart") { $("side").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (act === "tab") { S.tab = b.dataset.v; save(); renderTabs(); renderReg(); if (S.tab === "log") renderLog(); window.scrollTo({ top: 0 }); fitSide(); return; }
  if (act === "help") { $("helpBox").open = true; $("helpBox").scrollIntoView({ behavior: "smooth" }); return; }
  if (act === "fresh") { const ev2 = newEvent("新しいイベント"); S = { items: [], cons: [], events: [ev2], current: ev2.id, tab: "item", cart: [], disc: "", recv: [], cashMode: !!S.cashMode, sample: false }; save(); renderAll(); window.scrollTo({ top: 0 }); return; }
  if (act === "color") { const x = IT(id); if (x) x.color = b.dataset.v; }
  else if (act === "up" || act === "down") { const i = S.items.findIndex(x => x.id === id); if (i >= 0) move(i, act === "up" ? -1 : 1); }
  else if (act === "addItem") { const x = newItem(); x.color = COLORS[singles().length % COLORS.length]; const lastSingle = S.items.map(y => y.set).lastIndexOf(false); S.items.splice(lastSingle + 1, 0, x); S.sample = false; }
  else if (act === "addSet") { const x = newItem("新しいセット"); x.set = true; x.color = COLORS[4]; S.items.push(x); S.openSet = x.id; S.sample = false; }
  else if (act === "addCons") { S.cons.push(newCons()); S.sample = false; }
  else if (act === "delCons") { return arm(b, "もう一度押すと消します（商品は自分のものに戻ります）", () => { S.cons = S.cons.filter(c => c.id !== id); S.items.forEach(x => { if (x.from === id) x.from = ""; }); save(); renderAll(); }); }
  else if (act === "consMemo") { const o = consignOf(ev)[id]; if (!o) return; const txt = consMemo(ev, o); const m = $("cmMsg-" + id);
    const show = (t, bad) => { if (!m) return; m.textContent = t; m.className = "msg" + (bad ? " bad" : ""); clearTimeout(m._t); m._t = setTimeout(() => { m.textContent = ""; }, 4000); };
    try { navigator.clipboard.writeText(txt).then(() => show("コピーしました"), () => { const o2 = $("cmOut-" + id); o2.hidden = false; o2.value = txt; o2.select(); show("下の欄に出しました。選んでコピーしてください"); }); }
    catch (_) { const o2 = $("cmOut-" + id); o2.hidden = false; o2.value = txt; o2.select(); show("下の欄に出しました。選んでコピーしてください"); } return; }
  else if (act === "editSet") { S.openSet = S.openSet === id ? null : id; }
  else if (act === "delItem") { const x = IT(id); return arm(b, "もう一度押すと消します", () => { S.items = S.items.filter(y => y.id !== id); S.items.forEach(y => { if (y.set) y.parts = y.parts.filter(p => p.id !== id); }); S.cart = S.cart.filter(c => c.id !== id); save(); renderAll(); }); }
  else if (act === "newEvent") { const e2 = newEvent(); e2.stock = { ...ev.stock }; e2.start = ev.start; e2.startDen = { ...(ev.startDen || {}) }; e2.open = ev.open || ""; e2.close = ev.close || ""; S.events.push(e2); S.current = e2.id; S.cart = []; S.disc = ""; }
  else if (act === "delEvent") { return arm(b, `もう一度押すと「${ev.name}」の記録を全部消します`, () => { S.events = S.events.filter(e => e.id !== ev.id); S.current = S.events[0].id; S.cart = []; save(); renderAll(); }); }
  else if (act === "move") { const den = {}; DENOMS.forEach(d => { const el = $("mv-" + d); if (el && n(el.value) > 0) den[d] = n(el.value); });
    const a = hasDen(den) ? denSum(den) : n($("mvAmt").value); if (!a) { $("mvAmt").focus(); return; }
    const m = { id: uid(), t: Date.now(), amount: b.dataset.v === "out" ? -Math.abs(a) : Math.abs(a), memo: $("mvMemo").value };
    if (hasDen(den)) m.den = den; if (S.split) m.box = $("mvBox").value; ev.moves.push(m); }
  else if (act === "clrDen") { return arm(b, "もう一度押すと枚数を全部消します", () => { ev.startDen = {}; save(); renderAll(); }); }
  else if (act === "clrStock") { return arm(b, "もう一度押すと在庫を全部消します", () => { ev.stock = {}; save(); renderAll(); }); }
  else if (act === "clrLow") { return arm(b, "もう一度押すと全部消します", () => { singles().forEach(x => { x.low = ""; }); save(); renderAll(); }); }
  else if (act === "delMove") { return arm(b, "もう一度押すと消します", () => { ev.moves = ev.moves.filter(m => m.id !== id); save(); renderAll(); }); }
  else if (act === "void") { return arm(b, "もう一度押すと取り消します", () => { const s = ev.sales.find(s => s.id === id); if (s) s.void = true; save(); renderAll(); }); }
  else if (act === "unvoid") { const s = ev.sales.find(s => s.id === id); if (s) delete s.void; }
  else if (act === "csv") { const rows = [["日時", "イベント", "支払い", "商品", "委託元", "価格", "個数", "小計", "値引き", "会計の金額", "取り消し"]];
    const fromName = l => [...new Set(lineShares(l).map(x => (x.from ? (CO(x.from)?.name || "委託") : "自分")))].join("・");
    ev.sales.forEach(s => s.lines.forEach((l, i) => rows.push([mdhm(s.t), ev.name, PAY[s.pay], l.name, fromName(l), l.price, l.qty, l.price * l.qty, i ? "" : n(s.disc) || "", i ? "" : s.total, s.void ? "取り消し" : ""])));
    const txt = rows.map(r => r.map(v => { const s = String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\n");
    const o = $("csvOut"); o.hidden = false; o.value = txt; o.select(); try { navigator.clipboard.writeText(txt).then(() => { flash(b, "コピーしました"); }, () => {}); } catch (_) {} return; }
  else if (act === "impRead") { try { const o = JSON.parse($("impText").value); if (o.format !== "doujin-shushi" || !o.data?.products) throw 0;
      const d = o.data; const evCh = (d.channels || []).find(c => c.type === "event"); IMP = { products: d.products, channels: d.channels || [], ch: evCh ? evCh.id : (d.channels?.[0]?.id || ""), pick: Object.fromEntries(d.products.map(p => [p.id, true])) }; renderImpOut(); }
    catch (_) { $("impOut").innerHTML = `<p class="warn">読み込めませんでした。収支ツールで書き出した内容を、そのまま全部貼り付けてください。</p>`; } return; }
  else if (act === "impCancel") { IMP = null; renderImpOut(); return; }
  else if (act === "impDo") { if (!IMP) return; let add = 0, upd = 0;
    IMP.products.filter(p => IMP.pick[p.id]).forEach(p => { const row = (p.chans || []).find(r => r.ch === IMP.ch); const price = row && has(row.pp) ? n(row.pp) : has(p.tryPrice) ? n(p.tryPrice) : "";
      const ex = singles().find(x => x.name === p.name); if (ex) { if (price !== "") ex.price = price; upd++; } else { const x = newItem(p.name, price, p.color || COLORS[0]); const lastSingle = S.items.map(y => y.set).lastIndexOf(false); S.items.splice(lastSingle + 1, 0, x); add++; } });
    IMP = null; S.sample = false; save(); renderAll(); $("impOut").innerHTML = `<p class="lead">${add}件を足し、${upd}件の価格を書き換えました。在庫は商品の表で入れてください。</p>`; return; }
  else if (act === "exSave" || act === "exCopy") { doExport(act === "exSave" ? "save" : "copy", b); return; }
  else if (act === "import") { let o; try { o = JSON.parse($("m-io").value); if (o.format !== "doujin-regi" || !o.data?.items || !o.data?.events?.length) throw 0; } catch (_) { ioMsg("imMsg", "読み込めませんでした。書き出したファイルか、書き出した文字をそのまま全部入れてください", true); return; }
    const go = () => { S = o.data; S.sample = false; fix(); save(); renderAll(); ioMsg("imMsg", "読み込みました"); };
    if (S.sample || b.classList.contains("armed")) { go(); return; }
    // 確認中も貼り付けた文字を消さないよう、描き直さずにボタンだけ戻す
    b.classList.add("armed"); b.textContent = "もう一度押すと、今の記録を置き換えます"; setTimeout(() => { b.classList.remove("armed"); b.textContent = "読み込む"; }, 3000); return; }
  else if (act === "reset") { return arm(b, "もう一度押すと、今の記録を消してサンプルに戻します", () => { S = sample(); save(); renderAll(); }); }
  else return;
  save(); renderAll();
});

document.addEventListener("input", e => {
  const el = e.target, f = el.dataset.f; if (!f) return;
  const ev = EV(), v = el.value;
  if (f === "disc") { const dg = v.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, ""); S.disc = dg === "" ? "" : Number(dg); save(); renderBand(); renderReg(); const d = $("discIn"); d.focus(); const L = d.value.length; try { d.setSelectionRange(L, L); } catch (_) {} return; }
  if (f.startsWith("ev.")) { const k = f.slice(3); ev[k] = ["start", "counted"].includes(k) ? numish(v) : v;
    if (k === "counted") { const t = totals(ev); const d = has(ev.counted) ? n(ev.counted) - t.box : null; const o = document.querySelector('[data-out="diff"]'); o.textContent = diffText(d); o.className = d ? "warn" : "lead"; }
    save(); renderBand(); renderReg(); return; }
  const [kind, a, b] = f.split(":");
  if (kind === "sden") { ev.startDen = ev.startDen || {}; if (v === "") delete ev.startDen[a]; else ev.startDen[a] = Number(v);
    const auto = hasDen(ev.startDen); if (auto) ev.start = denSum(ev.startDen); const st = $("evStart"); st.readOnly = auto; if (auto) st.value = ev.start;
    document.querySelector('[data-out="starthint"]').textContent = auto ? "枚数から計算しています" : "枚数を入れないときは、ここに合計を入れます"; const cb = $("clrDenBtn"); if (cb) cb.disabled = !auto;
    save(); renderBand(); renderReg(); renderLog(); return; }
  if (kind === "item") { const x = IT(a); if (!x) return; x[b] = ["price", "low"].includes(b) ? numish(v) : v; S.cart.forEach(c => { if (c.id === a) { if (b === "name") c.name = v; if (b === "price") c.price = numish(v); } }); }
  else if (kind === "cons") { const c = CO(a); if (!c) return; c[b] = ["fee", "less"].includes(b) ? numish(v) : v; S.sample = false; save(); renderLog(); return; }
  else if (kind === "stock") { if (v === "") delete ev.stock[a]; else ev.stock[a] = Number(v); const o = document.querySelector(`[data-out="rem:${a}"]`); const r = remain(ev, a, soldMap(ev)); if (o) o.textContent = r == null ? "―" : r; }
  else if (kind === "part") { const x = IT(a); if (!x) return; const q = n(v); x.parts = x.parts.filter(p => p.id !== b); if (q > 0) x.parts.push({ id: b, q }); x.parts.sort((p, q2) => S.items.findIndex(i => i.id === p.id) - S.items.findIndex(i => i.id === q2.id)); }
  S.sample = false; save(); renderBand(); renderReg(); renderLog();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "imFile") { readIn(el.files[0]); return; }
  if (el.id === "impFile") { const f = el.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { $("impText").value = fr.result; }; fr.readAsText(f); return; }
  if (el.dataset.set) { const k = el.dataset.set; S[k] = el.checked; if (k === "split") { save(); renderLog(); return; } if (k === "payCash" && !el.checked && S.payLess === false) S.payLess = true; if (k === "payLess" && !el.checked && S.payCash === false) S.payCash = true; if (!el.checked) S.recv = []; save(); renderSettings(); renderReg(); fitSide(); return; }
  if (el.dataset.den) { const d = Number(el.dataset.den); const on = DENS_ON().filter(x => x !== d); if (el.checked) on.push(d); S.dens = on; S.recv = (S.recv || []).filter(x => on.includes(x)); save(); renderSettings(); renderReg(); return; }
  if (el.dataset.rank) { S.rankBy = el.value; save(); renderLog(); return; }
  if (el.dataset.slot) { S.slotMin = Number(el.value); save(); renderLog(); return; }
  if (el.dataset.slotsort) { S.slotSort = el.value; save(); renderLog(); return; }
  if (el.dataset.lg) { const f = LF(), k = el.dataset.lg; if (k === "sort") S.logSort = el.value; else if (k === "hideVoid") f.hideVoid = el.checked; else f[k] = el.value; save(); renderSales(EV()); return; }
  if (el.dataset.lgitem) { const f = LF(), id = el.dataset.lgitem; f.items = el.checked ? [...f.items, id] : f.items.filter(x => x !== id); save(); renderSales(EV()); return; }
  if (el.dataset.lgmode) { LF().mode = el.dataset.lgmode; save(); renderSales(EV()); return; }
  if (el.dataset.pick) { S.current = el.value; S.cart = []; S.disc = ""; save(); renderAll(); return; }
  if (el.dataset.impch !== undefined) { IMP.ch = el.value; renderImpOut(); return; }
  if (el.dataset.imp) { IMP.pick[el.dataset.imp] = el.checked; return; }
  if (el.dataset.f && el.dataset.f.startsWith("part:")) { save(); renderSets(); renderReg(); return; }
  // 描き直すと、続けて押したボタンが空振りするので、変わったところだけ書き換える
  if (el.dataset.f && el.dataset.f.startsWith("cons:")) { const [, cid, k] = el.dataset.f.split(":"); if (k === "name") document.querySelectorAll(`select[data-f$=":from"] option[value="${cid}"]`).forEach(o => { o.textContent = CO(cid)?.name || "（名前なし）"; }); return; }
  if (el.dataset.f && el.dataset.f.endsWith(":from")) { S.cons.forEach(c => { const o = document.querySelector(`[data-out="ccount:${c.id}"]`); if (o) o.textContent = singles().filter(x => x.from === c.id).length; }); renderLog(); return; }
  if (el.dataset.f && (el.dataset.f.endsWith(":name") || el.dataset.f === "ev.name")) { renderEvent(); renderSets(); renderLog(); }
});

load(); renderAll();
</script>
